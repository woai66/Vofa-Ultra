[package]
name = "vofa-ultra"
version = "0.1.0"
description = "A modern serial workbench for embedded development"
authors = ["Vofa-Ultra contributors"]
edition = "2021"
rust-version = "1.88.0"
license = "MIT"

[lib]
name = "vofa_ultra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.7", default-features = false }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
