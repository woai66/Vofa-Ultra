name: 功能建议
description: 描述一个具体工作流问题和可验证的改进
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明当前工作流、使用频率和阻碍，不要只写功能名称。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述交互、输入输出和失败时应发生什么。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案

  - type: textarea
    id: acceptance
    attributes:
      label: 验收方式
      description: 给出可以测试或观察的完成标准。
    validations:
      required: true
